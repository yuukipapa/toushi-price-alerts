name: Daily confluence scan (trendline x horizontal line)

on:
  schedule:
    - cron: "10 21 * * *"  # 21:10 UTC = 06:10 JST(market_scanの少し後にずらして実行)
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python confluence_scan.py
        env:
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
